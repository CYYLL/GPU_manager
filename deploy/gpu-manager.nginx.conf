# GPU Resource Manager - Nginx configuration
# Place in /etc/nginx/sites-available/gpu-manager
# Then: ln -s /etc/nginx/sites-available/gpu-manager /etc/nginx/sites-enabled/
# Then: systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Frontend static files
    root /amax/gpu_manager/frontend/build;
    # ⚠ Adjust root path if project directory changes
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
