# GPU Resource Manager v2 - Nginx configuration
# Place in /etc/nginx/sites-available/gpu-manager
# Then:  ln -sf /etc/nginx/sites-available/gpu-manager /etc/nginx/sites-enabled/
#         rm -f /etc/nginx/sites-enabled/default
#         nginx -t && systemctl reload nginx
#
# Serves the v2 frontend build and proxies /api to the v2 backend on :8000.
# The install-services.sh / gpu-manager-v2-cutover.sh scripts automate this.

server {
    listen 80;
    server_name _;

    # Frontend static files (v2 production build)
    root /amax/gpu_manager_v2/frontend/build;
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/agent/chat/stream streams SSE-style deltas over POST+ReadableStream:
        # buffering would stall the stream until the turn ends.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
